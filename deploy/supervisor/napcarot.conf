[program:napcarot-worker]
process_name=%(program_name)s_%(process_num)02d
directory=/var/www/napcarot.vn/laravel-app
command=/usr/bin/php8.2 /var/www/napcarot.vn/laravel-app/artisan queue:work --queue=topup,mails,user-logs,default --sleep=1 --tries=3 --timeout=60 --backoff=3 --memory=256 --max-time=3600 --no-interaction
autostart=true
autorestart=true
startsecs=10
startretries=5
stopsignal=TERM
stopasgroup=true
killasgroup=true
stopwaitsecs=120
user=www-data
numprocs=2
redirect_stderr=true
stdout_logfile=/var/www/napcarot.vn/laravel-app/storage/logs/queue-worker-%(process_num)02d.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5
environment=HOME="/var/www",USER="www-data"

[program:napcarot-scheduler]
process_name=%(program_name)s
directory=/var/www/napcarot.vn/laravel-app
command=/usr/bin/php8.2 /var/www/napcarot.vn/laravel-app/artisan schedule:work --no-interaction
autostart=true
autorestart=true
startsecs=10
startretries=5
stopsignal=TERM
stopasgroup=true
killasgroup=true
stopwaitsecs=60
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/napcarot.vn/laravel-app/storage/logs/scheduler.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5
environment=HOME="/var/www",USER="www-data"

[program:napcarot-reverb]
process_name=%(program_name)s
directory=/var/www/napcarot.vn/laravel-app
command=/usr/bin/php8.2 /var/www/napcarot.vn/laravel-app/artisan reverb:start --host=127.0.0.1 --port=8082 --no-interaction
autostart=true
autorestart=true
startsecs=5
startretries=5
stopsignal=TERM
stopasgroup=true
killasgroup=true
stopwaitsecs=30
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/napcarot.vn/laravel-app/storage/logs/reverb.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5
environment=HOME="/var/www",USER="www-data"

[group:napcarot]
programs=napcarot-worker,napcarot-scheduler,napcarot-reverb
priority=999
